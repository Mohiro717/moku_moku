<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ぬばたま落とし</title>
    <meta name="description" content="ぬばたま落とし - 御霊といっしょに、ぬばたまをつなげて消す落ちものパズル。CPU対戦とひとりであそぶ。">
    <meta property="og:type" content="website">
    <meta property="og:title" content="ぬばたま落とし">
    <meta property="og:description" content="御霊といっしょに、ぬばたまをつなげて消す落ちものパズル。">
    <meta property="og:locale" content="ja_JP">
    <meta name="twitter:card" content="summary">
    <meta name="theme-color" content="#f8f4e9">
    <meta name="robots" content="index, follow">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="./images/180x180px.png">

    <!-- ここから下（フォント・Tailwind の設定）は ../index.html と同じ。あちらを変えたらこちらも合わせる -->
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Potta+One&family=Noto+Sans+JP:wght@300;400;500;700&family=Yomogi&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS - 最新版を明示的に指定 -->
    <script src="https://cdn.tailwindcss.com/3.4.0"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'ivory': '#f8f4e9',
                        'coffee-dark': '#3b2f2f',
                        'coffee-mid': '#5a3a22',
                        'coffee-light': '#d2b48c',
                        'pastel-blue': '#e0f7fa',
                        'vivid-pink': '#ff5d8f',
                        'vivid-green': '#00c9a7'
                    },
                    fontFamily: {
                        'serif': ['Mochiy Pop One', 'sans-serif'],
                        'sans': ['Noto Sans JP', 'sans-serif']
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 1s ease-out forwards',
                        'bounce-slow': 'bounce 2s infinite',
                        'loading-progress': 'loadingProgress 2s ease-in-out infinite',
                        'poyopoyo': 'poyopoyo 1.5s ease-in-out infinite',
                        'shake': 'shake 0.5s ease-in-out infinite',
                        'sparkle': 'sparkle 2s ease-in-out infinite',
                        'glow': 'glow 2s ease-in-out infinite'
                    },
                    keyframes: {
                        fadeInUp: {
                            'from': {
                                opacity: '0',
                                transform: 'translateY(30px)'
                            },
                            'to': {
                                opacity: '1',
                                transform: 'translateY(0)'
                            }
                        },
                        loadingProgress: {
                            '0%': { width: '0%' },
                            '50%': { width: '70%' },
                            '100%': { width: '100%' }
                        },
                        poyopoyo: {
                            '0%, 100%': { 
                                transform: 'scale(1) translateY(0)' 
                            },
                            '25%': { 
                                transform: 'scale(1.2) translateY(-8px)' 
                            },
                            '50%': { 
                                transform: 'scale(0.9) translateY(4px)' 
                            },
                            '75%': { 
                                transform: 'scale(1.1) translateY(-2px)' 
                            }
                        },
                        shake: {
                            '0%, 100%': { transform: 'translateX(0)' },
                            '10%, 30%, 50%, 70%, 90%': { transform: 'translateX(-2px)' },
                            '20%, 40%, 60%, 80%': { transform: 'translateX(2px)' }
                        },
                        sparkle: {
                            '0%, 100%': { 
                                transform: 'scale(1) rotate(0deg)',
                                opacity: '1'
                            },
                            '25%': { 
                                transform: 'scale(1.2) rotate(90deg)',
                                opacity: '0.8'
                            },
                            '50%': { 
                                transform: 'scale(0.8) rotate(180deg)',
                                opacity: '0.6'
                            },
                            '75%': { 
                                transform: 'scale(1.1) rotate(270deg)',
                                opacity: '0.9'
                            }
                        },
                        glow: {
                            '0%, 100%': { 
                                textShadow: '0 0 5px rgba(236, 72, 153, 0.3)'
                            },
                            '50%': { 
                                textShadow: '0 0 20px rgba(236, 72, 153, 0.8), 0 0 30px rgba(147, 51, 234, 0.4)'
                            }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* CSS互換性のための修正 - Tailwind CDNの古いプレフィックスを上書き */
        html, :host {
            text-size-adjust: 100% !important;
        }
        
        /* Tailwindのマークダウンクラスも上書き */
        .markdown-SpwdOz {
            text-size-adjust: 100% !important;
        }
        
        .text-glow {
            text-shadow: 0 0 10px rgba(236, 72, 153, 0.5), 0 0 20px rgba(147, 51, 234, 0.3);
        }
    </style>
</head>
<body class="bg-ivory text-coffee-dark font-sans overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
</body>
</html>
